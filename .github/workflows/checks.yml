name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_private.py --all
      - run: python scripts/check_private.py --history
      - run: python -m unittest discover -s tests -p 'test_privacy_guard.py' -v
      - run: npm ci --ignore-scripts
      - run: npm test
